name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [github_cli, prolog_rlm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile plugin
        run: python -m compileall -q plugins/${{ matrix.plugin }}

      - name: Run plugin tests
        run: python -m unittest discover -s plugins/${{ matrix.plugin }}/tests -p 'test_*.py' -v
