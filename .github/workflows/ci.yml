name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  github-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile plugin
        run: python -m compileall -q plugins/github_cli

      - name: Run plugin tests
        run: python -m unittest discover -s plugins/github_cli/tests -p 'test_*.py' -v
